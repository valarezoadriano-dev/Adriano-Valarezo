<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="triangleEmeraldGrad" x1="12%" y1="12%" x2="88%" y2="88%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="sproutGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
  </defs>
  
  <!-- Squircle badge background for high visibility on both light and dark browser tabs -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#bgGrad)" stroke="#10b981" stroke-width="2.5" />
  
  <!-- Outer Geometrical Triangle Delta (Ingeniería y Rigor) -->
  <polygon points="50,18 84,78 16,78" fill="none" stroke="url(#triangleEmeraldGrad)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" />
  
  <!-- Vertex accent nodes -->
  <circle cx="50" cy="18" r="2.2" fill="#F59E0B" />
  <circle cx="84" cy="78" r="2.2" fill="#F59E0B" />
  <circle cx="16" cy="78" r="2.2" fill="#F59E0B" />
  
  <!-- Semilla / Raíz germinativa (Punto de anclaje) -->
  <circle cx="50" cy="71" r="4" fill="#F59E0B" />
  
  <!-- Tallo central ascendente -->
  <path d="M 50,71 C 50,60 50.5,49 50,40" fill="none" stroke="#A7F3D0" stroke-width="4.2" stroke-linecap="round" />
  
  <!-- Hoja izquierda de germinación (Inocuidad y Agroindustria) -->
  <path d="M 50,56 C 42,54 36.5,46.5 37,38.5 C 45,38.5 49.5,46.5 50,56 Z" fill="#34D399" />
  
  <!-- Hoja derecha de expansión agroindustrial (Gestión PMO y Sostenibilidad) -->
  <path d="M 50,48 C 58,46 63.5,38.5 63,30.5 C 55,30.5 50.5,38.5 50,48 Z" fill="#6EE7B7" />
  
  <!-- Yema apical dorada (Crecimiento continuo) -->
  <circle cx="50" cy="40" r="2.5" fill="#F59E0B" />
</svg>
